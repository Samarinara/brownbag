services:
  brownbag:
    build: .
    ports:
      - '127.0.0.1:${HOST_PORT}:${PORT:-3000}'
    environment:
      PORT: ${PORT:-3000}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:${PORT:-3000}}
      DATABASE_PATH: /data/brownbag.sqlite
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM to your verified sender address in .env}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
    volumes:
      - brownbag-data:/data
    # Keep the health check when Podman builds an OCI image.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:${PORT:-3000}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  brownbag-data:
