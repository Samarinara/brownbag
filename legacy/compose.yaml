services:
  brownbag:
    build: .
    ports:
      - '127.0.0.1:${HOST_PORT:-3000}:${PORT:-3000}'
    env_file: .env
    environment:
      PORT: ${PORT:-3000}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:${PORT:-3000}}
    # Keep the health check when Podman builds an OCI image.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:${PORT:-3000}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  indexer:
    build: .
    env_file: .env
    command: ['node', 'dist/indexer.js']
    healthcheck:
      disable: true
    restart: unless-stopped
    init: true
