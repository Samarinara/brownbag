name: Clean expired database state
run-name: Maintain database-${{ inputs.target || 'production' }} at ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Database environment to maintain
        required: true
        type: choice
        options: [preview, production]
      dry_run:
        description: Count eligible rows without deleting them
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '41 4 * * *'

permissions:
  contents: read

concurrency:
  group: database-operations-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  maintain:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.DATABASE_MAINTENANCE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: database-${{ inputs.target || 'production' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove expired transient state
        run: |
          test -n "$DATABASE_URL" || { echo 'Set DATABASE_MAINTENANCE_URL in the selected GitHub environment.'; exit 1; }
          node --import tsx server/maintenance.task.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MAINTENANCE_URL }}
          MAINTENANCE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
