name: Release reviewed production build
run-name: Release production at ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-operations-production
  cancel-in-progress: false

jobs:
  verify-and-migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: database-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Apply production migrations
        run: |
          test -n "$DATABASE_URL" || { echo 'Set DATABASE_URL in database-production.'; exit 1; }
          npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  stage-and-smoke:
    needs: verify-and-migrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-staging
    outputs:
      url: ${{ steps.stage.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install reviewed Vercel CLI
        run: |
          [[ "$VERCEL_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Set an exact VERCEL_CLI_VERSION.'; exit 1; }
          test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Pull production build configuration
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod
      - name: Stage production without assigning domains
        id: stage
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain)"
          DEPLOYMENT_URL="$deployment_url" node --input-type=module -e '
            const value = process.env.DEPLOYMENT_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.origin !== value || !url.hostname.endsWith(".vercel.app")) process.exit(1);
          '
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Check staged API and database configuration
        run: |
          node --input-type=module <<'NODE'
          const headers = {};
          if (process.env.VERCEL_AUTOMATION_BYPASS_SECRET)
            headers['x-vercel-protection-bypass'] = process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
          for (const path of ['/health', '/api/config']) {
            const response = await fetch(new URL(path, process.env.DEPLOYMENT_URL), {
              headers, redirect: 'error', signal: AbortSignal.timeout(30_000),
            });
            if (!response.ok) throw new Error(`Staged check ${path} returned ${response.status}`);
            const body = await response.json();
            if (path === '/health' && body.status !== 'ok') throw new Error('Database is not healthy');
            if (path === '/api/config' && body.configured !== true) throw new Error('OAuth or database is not configured');
          }
          console.info('Staged API and database checks passed.');
          NODE
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  promote:
    needs: stage-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-promotion
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install reviewed Vercel CLI
        run: |
          [[ "$VERCEL_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Set an exact VERCEL_CLI_VERSION.'; exit 1; }
          test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Promote the tested production deployment
        run: vercel promote "$DEPLOYMENT_URL" --yes
        env:
          DEPLOYMENT_URL: ${{ needs.stage-and-smoke.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
