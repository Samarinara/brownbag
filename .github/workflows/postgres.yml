name: Verify PostgreSQL compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brownbag_test
          POSTGRES_PASSWORD: brownbag_test
          POSTGRES_DB: brownbag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brownbag_test -d brownbag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://brownbag_test:brownbag_test@127.0.0.1:5432/brownbag_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/postgres-driver.test.ts
